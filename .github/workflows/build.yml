# Сборка Windows x64.
#
#  push / pull request / ручной запуск -> exe в артефакте сборки (вкладка Actions)
#  тег vX.Y.Z                          -> черновик релиза с zip и SHA-256
#                                         (проверить и нажать Publish вручную)
name: Build

on:
  push:
    branches: [ main, "release/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "name=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.name }}"
          $name    = "GuitarTX-$version-win64"
          $dir     = "dist/$name"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "build/GuitarTX_artefacts/Release/GuitarTX.exe" $dir
          Copy-Item "LICENSE.md", "THIRD_PARTY_NOTICES.md" $dir
          (Get-Content "packaging/README.txt" -Raw).Replace("{{VERSION}}", $version) |
              Set-Content "$dir/README.txt" -Encoding utf8

          $zip = "dist/$name.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256" -Encoding ascii

          "zip=$zip"   >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "dir=$dir"   >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTX-${{ steps.version.outputs.name }}-win64
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error

      - name: Release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # Раздел CHANGELOG.md для этой версии: от "## [X.Y.Z]" до следующего "## ["
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines   = Get-Content "CHANGELOG.md"
          $start   = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber

          if ($start) {
            $rest  = $lines[$start..($lines.Count - 1)]
            $next  = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
            $notes = if ($next) { $rest[0..($next - 2)] } else { $rest }
          } else {
            $notes = @("See CHANGELOG.md")
          }

          $notes += ""
          $notes += "SHA-256 (zip): ``${{ steps.package.outputs.hash }}``"
          $notes | Set-Content "dist/release-notes.md" -Encoding utf8

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GuitarTX ${{ github.ref_name }}
          body_path: dist/release-notes.md
          draft: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
