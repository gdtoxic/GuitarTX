# Сборка Windows x64.
#
#  push / pull request / ручной запуск -> exe в артефакте сборки (вкладка Actions)
#  опубликованный релиз (тег vX.Y.Z)   -> zip и SHA-256 прикрепляются к релизу
name: Build

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          } else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "name=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.name }}"
          $name    = "GuitarTX-$version-win64"
          $dir     = "dist/$name"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "build/GuitarTX_artefacts/Release/GuitarTX.exe" $dir
          Copy-Item "LICENSE.md", "THIRD_PARTY_NOTICES.md" $dir
          (Get-Content "packaging/README.txt" -Raw).Replace("{{VERSION}}", $version) |
              Set-Content "$dir/README.txt" -Encoding utf8

          $zip = "dist/$name.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256" -Encoding ascii

          "zip=$zip"   >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "dir=$dir"   >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTX-${{ steps.version.outputs.name }}-win64
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          gh release upload "${{ github.event.release.tag_name }}" $zip "$zip.sha256" --clobber --repo "${{ github.repository }}"
